http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT

# These are model/auth control planes, not general research endpoints. Keep
# this list narrow and inspect denied-domain logs before adding anything.
acl model_control_plane dstdomain \
    api.anthropic.com \
    claude.ai \
    api.openai.com \
    auth.openai.com \
    chatgpt.com \
    openrouter.ai \
    api.openrouter.ai \
    bedrock-runtime.us-east-1.amazonaws.com \
    sts.us-east-1.amazonaws.com

http_access allow CONNECT model_control_plane SSL_ports
http_access deny all

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid.pid
